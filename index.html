<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050816">
  <title>✨ Для Лери ✨</title>
  <meta property="og:title" content="✨ Для Лери ✨">
  <meta property="og:description" content="Відкрий, коли будеш готова 💌">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Marck+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="moon" aria-hidden="true"></div>
  <canvas id="fx"></canvas>

  <main>
    <section id="intro" class="scene shown visible">
      <button id="envelope" class="envelope" aria-label="Відкрити конверт">
        <span class="env-back"></span>
        <span class="env-card"><span class="heart">♥</span></span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
        <span class="env-seal">★</span>
      </button>
      <p class="hint" id="hint"></p>
    </section>

    <section id="letter" class="scene">
      <h1 class="title" id="title"></h1>
      <article class="paper" id="paper">
        <div class="letter-text" id="letter-text"></div>
        <p class="signature" id="signature"></p>
      </article>
      <button class="btn hidden" id="to-cake">Далі →</button>
    </section>

    <section id="cake-scene" class="scene">
      <p class="subtitle" id="wish"></p>
      <div class="cake" id="cake">
        <div class="candles" id="candles"></div>
        <div class="tier top"></div>
        <div class="tier bottom"></div>
        <div class="plate"></div>
      </div>
      <button class="btn ghost" id="mic-btn">🎤 Подути в мікрофон</button>
      <p class="small" id="cake-hint">або торкнись кожного вогника</p>
    </section>

    <section id="finale" class="scene">
      <figure class="polaroid reveal" id="polaroid">
        <img id="photo" alt="Ми разом">
        <figcaption id="caption"></figcaption>
      </figure>
      <p class="final-message reveal" id="final-message"></p>
      <button class="btn ghost reveal" id="again">Ще феєрверк ✨</button>
    </section>
  </main>

  <button id="music-toggle" class="music-toggle" hidden aria-label="Увімкнути або вимкнути музику">♪</button>

  <script src="script.js"></script>
</body>
</html>
